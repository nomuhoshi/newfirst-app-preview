<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f7f7f5" />
  <title>碎片编程 · 技术验证</title>
  <script type="module" crossorigin src="./assets/lab-CXZ5AMgw.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/errors-DQXCMQzz.js">
  <link rel="stylesheet" crossorigin href="./assets/errors-DE9dolOj.css">
</head>
<body>
  <main id="app">
    <section id="task">
      <h1>第 1 步 · 技术验证</h1>
      <p>任务：写一行代码，让程序输出 <code>5</code>。<br>提示：<code>print(2 + 3)</code></p>
    </section>
    <div id="editor" aria-label="代码编辑区"></div>
    <div id="controls">
      <button id="run" type="button" disabled>Run</button>
      <button id="stop" type="button" disabled>Stop</button>
      <span id="status" role="status" aria-live="polite">准备中…</span>
    </div>
    <pre id="output" aria-live="polite"></pre>
    <div id="system-bar" hidden>
      正在使用系统键盘（没弹出就再点一下代码区） <button id="back-to-kb" type="button">返回内置键盘</button>
    </div>
    <div id="keyboard" role="group" aria-label="编程键盘"></div>
  </main>
</body>
</html>
